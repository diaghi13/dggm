services:
  frontend:
    container_name: dggm-frontend
    image: dggm-frontend:latest
    build:
      context: ./frontend
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i | awk '{print $1}'):3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
